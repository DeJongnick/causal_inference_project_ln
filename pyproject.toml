[project]
name = "ira-chips-causal"
version = "0.1.0"
description = "IRA & CHIPS Act: causal effect on US industrial investment (DiD, Synthetic Control)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
]
